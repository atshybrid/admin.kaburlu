<!DOCTYPE html>
<html lang="te">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BLOCK-12A — Local Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f1f5f9; }
    header { background: linear-gradient(135deg,#5b21b6,#7c3aed); color: #fff; padding: 12px 20px; }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 4px 0 0; font-size: 12px; opacity: 0.92; }
    header code { background: rgba(255,255,255,0.15); padding: 2px 6px; border-radius: 4px; font-size: 11px; }
    main { display: grid; grid-template-columns: 420px 1fr; min-height: calc(100vh - 60px); }
    @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
    .form { padding: 14px; background: #fff; border-right: 1px solid #cbd5e1; overflow: auto; max-height: calc(100vh - 60px); }
    label { display: block; font-size: 11px; font-weight: 600; margin: 8px 0 3px; color: #334155; }
    input, textarea { width: 100%; padding: 7px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; }
    textarea { min-height: 70px; }
    button { margin-top: 10px; width: 100%; padding: 10px; background: #7c3aed; color: #fff; border: 0; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .errors { color: #b91c1c; font-size: 12px; margin-top: 8px; white-space: pre-wrap; }
    .meta { font-size: 11px; color: #64748b; margin-top: 8px; line-height: 1.5; }
    .urls { font-size: 10px; margin-top: 10px; padding: 8px; background: #f8fafc; border-radius: 6px; }
    .urls a { color: #5b21b6; word-break: break-all; }
    .preview { padding: 16px; overflow: auto; background: #e2e8f0; }
    iframe { width: 100%; min-height: 88vh; border: 0; border-radius: 8px; box-shadow: 0 4px 24px rgba(0,0,0,0.12); }
    .hint { font-size: 10px; color: #64748b; margin-top: 2px; }
  </style>
</head>
<body>
  <header>
    <h1>BLOCK-12A — 12in · 4 columns · max 21in</h1>
    <p>Col1: highlights+text · Col2–4: images 1–3 top+text · Bottom: images 4–16 in 4-col grid</p>
  </header>
  <main>
    <div class="form">
      <label>Title *</label>
      <input id="title" value="బ్లాక్-12A: నాలుగు నిలువు వరుసల లేఅవుట్" />
      <label>Subtitle</label>
      <input id="subtitle" value="12 అంగుళాల వెడల్పు · గరిష్ట 21 అంగుళాల ఎత్తు" />
      <label>Highlight 1–4</label>
      <input id="h1" value="పథకాల అమలు" />
      <input id="h2" value="పారదర్శకత" />
      <input id="h3" value="ప్రజా సంబంధాలు" />
      <input id="h4" value="అభివృద్ధి" />
      <label>Image 1 URL (col 2 top)</label>
      <input id="img1" />
      <label>Image 2 URL (col 3 top)</label>
      <input id="img2" />
      <label>Image 3 URL (col 4 top)</label>
      <input id="img3" />
      <label>Bottom gallery URLs (cols 1–4, one per line, max 13)</label>
      <textarea id="bottomImgs" rows="5"></textarea>
      <p class="hint">మొత్తం గరిష్ట 16 చిత్రాలు (3 పైన + 13 దిగువ)</p>
      <label>Content * (300–750 words)</label>
      <textarea id="content" rows="6"></textarea>
      <button type="button" id="renderBtn">Render BLOCK-12A</button>
      <button type="button" id="sampleBtn" style="margin-top:6px;background:#475569">Load sample (10 images)</button>
      <div class="errors" id="errors"></div>
      <div class="meta" id="meta"></div>
      <div class="urls">
        <strong>URLs</strong><br />
        Demo: <a id="linkDemo" href="#">demo</a><br />
        Preview: <a id="linkPreview" href="#">preview</a><br />
        API: <code>POST /layout/block12/render</code>
      </div>
    </div>
    <div class="preview">
      <iframe id="frame" title="BLOCK-12A preview"></iframe>
    </div>
  </main>
  <script>
    const API = window.location.origin
    const SAMPLE = [
      'https://picsum.photos/seed/block12-top1/800/600',
      'https://picsum.photos/seed/block12-top2/800/600',
      'https://picsum.photos/seed/block12-top3/800/600',
      'https://picsum.photos/seed/block12-bot1/600/450',
      'https://picsum.photos/seed/block12-bot2/600/450',
      'https://picsum.photos/seed/block12-bot3/600/450',
      'https://picsum.photos/seed/block12-bot4/600/450',
      'https://picsum.photos/seed/block12-bot5/600/450',
      'https://picsum.photos/seed/block12-bot6/600/450',
      'https://picsum.photos/seed/block12-bot7/600/450',
    ]
    document.getElementById('linkDemo').href = API + '/static/demo.html'
    document.getElementById('linkPreview').href = API + '/layout/block12/preview'

    const seed = 'ఈ రోజు జరిగిన విస్తృత సమావేశంలో అధికారులు ప్రజా హితాలను ప్రాధాన్యతగా పరిగణించాలని నిర్ణయించారు. స్థానిక సమస్యలపై చర్చ జరిగింది. విద్య, ఆరోగ్యం, రోడ్లు పై దృష్టి సారించాలని సూచనలు వచ్చాయి. పారదర్శకత పాటిస్తూ పథకాలను అమలు చేయాలని హామీ ఇచ్చారు. '
    let c = ''
    while (c.split(/\s+/).filter(Boolean).length < 420) c += seed
    document.getElementById('content').value = c.split(/\s+/).slice(0, 420).join(' ')

    function loadSampleImages() {
      document.getElementById('img1').value = SAMPLE[0]
      document.getElementById('img2').value = SAMPLE[1]
      document.getElementById('img3').value = SAMPLE[2]
      document.getElementById('bottomImgs').value = SAMPLE.slice(3).join('\n')
    }
    loadSampleImages()

    document.getElementById('sampleBtn').addEventListener('click', loadSampleImages)

    async function doRender() {
      const errorsEl = document.getElementById('errors')
      const metaEl = document.getElementById('meta')
      errorsEl.textContent = ''
      metaEl.textContent = 'Loading…'
      const highlights = ['h1','h2','h3','h4'].map((id) => document.getElementById(id).value).filter(Boolean)
      const top = [document.getElementById('img1').value, document.getElementById('img2').value, document.getElementById('img3').value].filter(Boolean)
      const bottom = document.getElementById('bottomImgs').value.split(/\n/).map((s) => s.trim()).filter(Boolean)
      const images = [...top, ...bottom].slice(0, 16)
      const body = {
        title: document.getElementById('title').value,
        subtitle: document.getElementById('subtitle').value,
        highlights,
        image: images,
        content: document.getElementById('content').value,
      }
      try {
        const res = await fetch(API + '/layout/block12/render', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        })
        const data = await res.json()
        if (!data.valid) {
          errorsEl.textContent = (data.errors || [data.error]).join('\n')
          metaEl.textContent = `words: ${data.wordCount} · height: ${data.estimatedHeightMm}mm`
          return
        }
        const ver = (data.html.match(/data-engine-version="([^"]+)"/) || [])[1] || 'threaded-v1.1'
        metaEl.textContent = `${ver} · words: ${data.wordCount} · est: ${data.estimatedHeightMm}mm · imgs: ${data.imageCount} (top ${data.columnTopCount}, bottom ${data.bottomImageCount}) · 12in·4col`
        let doc = data.previewHtml || ''
        if (doc) {
          doc = doc.replace(/src="\/static\//g, `src="${API}/static/`)
        } else {
          doc = `<!DOCTYPE html><html lang="te"><head><meta charset="utf-8"><style>${data.css}</style></head><body style="margin:0;padding:20px;background:#e2e8f0"><main id="block12a-root">${data.html}</main><script src="${API}/static/threadBalance.js?v=${encodeURIComponent(ver)}"><\/script></body></html>`
        }
        document.getElementById('frame').srcdoc = doc
      } catch (e) {
        errorsEl.textContent = e.message
        metaEl.textContent = ''
      }
    }

    document.getElementById('renderBtn').addEventListener('click', doRender)
    doRender()
  </script>
</body>
</html>
